<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b141a;--header:#202c33;--input:#2a3942;--sent:#005c4b;--received:#202c33;--text:#e9edef;--secondary:#8696a0;--accent:#00a884;--blue-tick:#53bdeb;--hover:#2a3942;--divider:#111b21;--overlay:rgba(0,0,0,0.5);--danger:#ea4335}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
body{position:fixed;top:0;left:0;right:0;bottom:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{width:100%;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
.screen{display:none;position:absolute;top:0;left:0;width:100%;height:100%;flex-direction:column}
.screen.active{display:flex}

/* Password Screen */
#password{background:var(--bg);align-items:center;justify-content:center;padding:20px}
#password .pw-icon{font-size:60px;margin-bottom:16px}
#password h2{font-size:20px;margin-bottom:24px;font-weight:400;color:var(--secondary)}
#password .pw-dots{display:flex;gap:12px;margin-bottom:24px}
#password .pw-dot{width:14px;height:14px;border-radius:50%;background:var(--input);transition:background .2s}
#password .pw-dot.filled{background:var(--accent)}
#password .pw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;width:100%}
#password .pw-key{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500;border:none;border-radius:12px;background:var(--input);color:var(--text);cursor:pointer;transition:background .15s}
#password .pw-key:active{background:var(--hover)}
#password .pw-key.empty{background:transparent;cursor:default}
#password .pw-key.del{font-size:16px;color:var(--danger)}
#password .pw-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

/* Setup Screen */
#setup{background:var(--bg);align-items:center;justify-content:center;padding:20px}
#setup .logo{font-size:48px;margin-bottom:8px}
#setup h2{font-size:22px;margin-bottom:20px;font-weight:400}
#setup .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px;max-width:320px;width:100%}
#setup .avatar-option{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s;background:var(--header)}
#setup .avatar-option:hover{border-color:var(--secondary)}
#setup .avatar-option.selected{border-color:var(--accent);background:rgba(0,168,132,.15)}
#setup input{width:100%;max-width:320px;padding:14px 16px;border:none;border-radius:12px;background:var(--input);color:var(--text);font-size:16px;outline:none;margin-bottom:16px}
#setup input::placeholder{color:var(--secondary)}
#setup button{width:100%;max-width:320px;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:opacity .2s}
#setup button:disabled{opacity:.4;cursor:not-allowed}

/* Room Screen */
#room{background:var(--bg);align-items:center;justify-content:center;padding:20px}
#room h2{font-size:20px;margin-bottom:24px;font-weight:400}
#room .room-section{width:100%;max-width:320px;margin-bottom:24px}
#room .room-section p{color:var(--secondary);font-size:13px;margin-bottom:10px;text-align:center}
#room input{width:100%;padding:14px 16px;border:none;border-radius:12px;background:var(--input);color:var(--text);font-size:16px;outline:none;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;text-align:center}
#room input::placeholder{text-transform:none;letter-spacing:normal}
#room button{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:opacity .2s}
#room .divider{display:flex;align-items:center;width:100%;max-width:320px;margin:16px 0;color:var(--secondary);font-size:13px}
#room .divider::before,#room .divider::after{content:'';flex:1;height:1px;background:var(--input)}
#room .divider span{padding:0 12px}

/* Chat Screen */
#chat{background:var(--bg)}
#chat .chat-header{background:var(--header);padding:10px 8px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:10}
#chat .chat-header .back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;border-radius:50%}
#chat .chat-header .header-avatar{width:40px;height:40px;border-radius:50%;background:var(--input);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
#chat .chat-header .header-info{flex:1;min-width:0}
#chat .chat-header .room-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#chat .chat-header .room-status{font-size:12px;color:var(--secondary);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#chat .chat-header .conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
#chat .chat-header .conn-dot.online{background:#25d366}
#chat .chat-header .conn-dot.offline{background:#ea4335}
#chat .chat-header .user-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
#chat .chat-header .user-pill{display:inline-flex;align-items:center;gap:3px;background:var(--input);border-radius:10px;padding:1px 8px 1px 3px;font-size:11px;color:var(--secondary)}
#chat .chat-header .user-pill .pill-avatar{font-size:13px}
#chat .chat-header .user-pill .pill-dot{width:5px;height:5px;border-radius:50%;background:#25d366;flex-shrink:0}
#chat .chat-header .header-actions{display:flex;gap:2px}
#chat .chat-header .header-actions button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;border-radius:50%}

#chat .messages{flex:1;overflow-y:auto;padding:8px 12px;scroll-behavior:smooth;position:relative}
#chat .messages::-webkit-scrollbar{width:4px}
#chat .messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
#chat .messages .chat-bg{position:absolute;top:0;left:0;right:0;bottom:0;opacity:.04;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5L35 15H25L30 5ZM15 20L25 20L20 30ZM45 20L55 20L50 30ZM30 35L40 35L35 45Z' fill='%23ffffff'/%3E%3C/svg%3E")}

.time-divider{text-align:center;margin:12px 0;position:relative;z-index:1}
.time-divider span{background:rgba(17,27,33,.85);color:var(--secondary);font-size:12px;padding:4px 12px;border-radius:8px}

.message{display:flex;margin:2px 0;position:relative;z-index:1;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.message.sent{justify-content:flex-end}
.message.received{justify-content:flex-start}
.message .msg-avatar{width:28px;height:28px;border-radius:50%;background:var(--input);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-right:6px;align-self:flex-end}
.message .bubble{max-width:78%;padding:6px 8px;border-radius:8px;position:relative;word-wrap:break-word;min-width:60px}
.message.sent .bubble{background:var(--sent);border-bottom-right-radius:3px}
.message.received .bubble{background:var(--received);border-bottom-left-radius:3px}
.message .sender{font-size:12.5px;font-weight:500;color:var(--accent);margin-bottom:2px}
.message .reply-ref{background:rgba(0,0,0,.25);border-left:3px solid var(--accent);border-radius:4px;padding:4px 8px;margin-bottom:4px;font-size:12px;color:var(--secondary);cursor:pointer}
.message .reply-ref .reply-sender{font-weight:500;color:var(--accent);font-size:11.5px}
.message .reply-ref .reply-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.message .msg-text{font-size:14.5px;line-height:1.35;white-space:pre-wrap}
.message .msg-img{max-width:240px;border-radius:6px;margin-top:4px;cursor:pointer}
.message .msg-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:1px}
.message .msg-time{font-size:11px;color:rgba(233,237,237,.55)}
.message .msg-edited{font-size:10.5px;color:rgba(233,237,237,.45);font-style:italic}
.message .ticks{font-size:11px;color:var(--blue-tick)}
.message .ticks.sent-tick{color:rgba(233,237,237,.55)}
.message.system-msg{text-align:center;justify-content:center !important}
.message.system-msg .bubble{background:rgba(17,27,33,.85);color:var(--secondary);font-size:12.5px;padding:4px 12px;border-radius:8px;max-width:85%;text-align:center}
.message.deleted-msg .bubble{color:var(--secondary);font-style:italic;font-size:13px}

.typing-indicator{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:13px;color:var(--secondary);z-index:1;position:relative}
.typing-dots{display:flex;gap:3px}
.typing-dots span{width:6px;height:6px;background:var(--secondary);border-radius:50%;animation:typingBounce 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}

#chat .reply-bar{background:var(--header);padding:8px 12px;display:none;align-items:center;border-top:1px solid rgba(255,255,255,.05);z-index:10;flex-shrink:0}
#chat .reply-bar.active{display:flex}
#chat .reply-bar .reply-info{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;margin-right:8px}
#chat .reply-bar .reply-info .rp-name{font-size:12.5px;font-weight:500;color:var(--accent)}
#chat .reply-bar .reply-info .rp-text{font-size:12.5px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat .reply-bar .reply-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--secondary);font-size:18px;cursor:pointer}

#chat .input-bar{background:var(--header);padding:6px 6px;display:flex;align-items:flex-end;gap:4px;flex-shrink:0;z-index:10}
#chat .input-bar .icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--secondary);font-size:22px;cursor:pointer;flex-shrink:0;border-radius:50%}
#chat .input-bar .icon-btn.active{color:var(--accent)}
#chat .input-bar .msg-input{flex:1;background:var(--input);border:none;border-radius:24px;padding:10px 16px;color:var(--text);font-size:15px;outline:none;max-height:100px;overflow-y:auto;resize:none;line-height:1.4;min-height:44px;font-family:inherit}
#chat .input-bar .msg-input::placeholder{color:var(--secondary)}
#chat .input-bar .send-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--accent);border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;transition:transform .15s}
#chat .input-bar .send-btn:active{transform:scale(.9)}

.emoji-picker{display:none;background:var(--header);border-top:1px solid rgba(255,255,255,.05);padding:8px 12px;z-index:10;flex-shrink:0}
.emoji-picker.open{display:block}
.emoji-picker .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-picker .emoji-item{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border-radius:8px;border:none;background:none;transition:background .15s}
.emoji-picker .emoji-item:hover{background:var(--hover)}

/* Photo preview */
.photo-preview{background:var(--header);padding:8px 12px;display:none;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.05);z-index:10;flex-shrink:0}
.photo-preview.active{display:flex}
.photo-preview img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.photo-preview .photo-info{flex:1;font-size:13px;color:var(--secondary)}
.photo-preview .photo-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--secondary);font-size:16px;cursor:pointer}

/* Action Menu */
.action-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:100;justify-content:center;align-items:center}
.action-overlay.active{display:flex}
.action-menu{background:var(--header);border-radius:12px;overflow:hidden;min-width:200px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.action-menu button{width:100%;padding:14px 20px;background:none;border:none;color:var(--text);font-size:15px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
.action-menu button:hover{background:var(--hover)}
.action-menu button i{width:20px;text-align:center;color:var(--secondary)}

/* Settings Panel */
.settings-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:100;justify-content:center;align-items:flex-end}
.settings-overlay.active{display:flex}
.settings-panel{background:var(--header);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:50vh;overflow-y:auto;padding:16px 0}
.settings-panel .settings-title{padding:0 20px 12px;font-size:18px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.05)}
.settings-panel button{width:100%;padding:16px 20px;background:none;border:none;color:var(--text);font-size:15px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;transition:background .15s}
.settings-panel button:hover{background:var(--hover)}
.settings-panel button i{width:22px;text-align:center;color:var(--secondary);font-size:18px}
.settings-panel button.danger{color:var(--danger)}
.settings-panel button.danger i{color:var(--danger)}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--header);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <!-- Password Screen -->
  <div id="password" class="screen active">
    <div class="pw-icon">🔒</div>
    <h2>Enter Password</h2>
    <div class="pw-dots" id="pwDots"></div>
    <div class="pw-grid" id="pwGrid"></div>
    <div class="pw-err" id="pwErr"></div>
  </div>

  <!-- Setup Screen -->
  <div id="setup" class="screen">
    <div class="logo">💬</div>
    <h2>Welcome to Chat</h2>
    <div class="avatar-grid" id="avatarGrid"></div>
    <input type="text" id="usernameInput" placeholder="Your name" maxlength="20" autocomplete="off">
    <button id="setupBtn" disabled>Next</button>
  </div>

  <!-- Room Screen -->
  <div id="room" class="screen">
    <h2>Join a Room</h2>
    <div class="room-section">
      <p>Create a new room</p>
      <button id="createRoomBtn">Create Room</button>
    </div>
    <div class="divider"><span>OR</span></div>
    <div class="room-section">
      <p>Join an existing room</p>
      <input type="text" id="roomCodeInput" placeholder="Enter room code" maxlength="12" autocomplete="off">
      <button id="joinRoomBtn">Join Room</button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat" class="screen">
    <div class="chat-header">
      <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
      <div class="header-avatar" id="headerAvatar"></div>
      <div class="header-info">
        <div class="room-name" id="roomName"></div>
        <div class="room-status">
          <span class="conn-dot offline" id="connDot"></span>
          <span id="statusText">Connecting...</span>
        </div>
        <div class="user-pills" id="userPills"></div>
      </div>
      <div class="header-actions">
        <button id="settingsBtn" title="Settings"><i class="fas fa-ellipsis-vertical"></i></button>
      </div>
    </div>
    <div class="messages" id="messagesContainer">
      <div class="chat-bg"></div>
      <div id="messagesList"></div>
      <div class="typing-indicator" id="typingIndicator" style="display:none">
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="typingText"></span>
      </div>
    </div>
    <div class="reply-bar" id="replyBar">
      <div class="reply-info">
        <div class="rp-name" id="rpName"></div>
        <div class="rp-text" id="rpText"></div>
      </div>
      <button class="reply-close" id="replyClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="photo-preview" id="photoPreview">
      <img id="photoPreviewImg" src="">
      <div class="photo-info">Image ready to send</div>
      <button class="photo-close" id="photoClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="emoji-picker" id="emojiPicker">
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>
    <div class="input-bar">
      <button class="icon-btn" id="emojiBtn"><i class="far fa-smile"></i></button>
      <button class="icon-btn" id="photoBtn"><i class="fas fa-image"></i></button>
      <input type="file" id="photoInput" accept="image/*" style="display:none">
      <input type="text" class="msg-input" id="msgInput" placeholder="Type a message" autocomplete="off">
      <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-title">Settings</div>
      <button id="settingsCopyCode"><i class="fas fa-copy"></i>Copy Room Code</button>
      <button id="settingsLeave" class="danger"><i class="fas fa-right-from-bracket"></i>Leave Room</button>
    </div>
  </div>

  <!-- Action Overlay -->
  <div class="action-overlay" id="actionOverlay">
    <div class="action-menu" id="actionMenu"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<script>
const SERVER_HOST='chart-app-lenp.onrender.com';
const APP_PASSWORD='1116';
const AVATARS=['😀','😂','🥹','😍','🥰','😎','🤩','😏','🤔','🫡','😭','🥺','💀','🤖','👻','🐱','🐶','🦊','🐼','🦁','🐸','🌍','🔥','⭐','💎','🎮','🎵','🏆','🚀','⚡'];
const EMOJIS=['😀','😂','❤️','👍','🔥','😍','🥰','😎','🤔','😭','🥺','✨','🎉','👋','💯','🙌','😅','🤣','😊','😇','🙂','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🫡','🤐','🤨','😐','😑','😶','😏','😒','🙄','😬','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕','🤢','🤮','🥵','🥶','🥴','😵','🤯','🤠','🥳','🥸','😎','🤓','🧐','😕','😟','🙁','😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','🥱','😤','😡','😠','🤬','😈','👿','💀','👻','👽','🤖','💩','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','⭐','🌟','💫','🌈','☀️','🌤️','⛅','🌥️','☁️','🌧️','🌮','🍕','🍔','🍟','🎮','🎯','🏆','🎪','🎨','🎭','🎤','🎧','🎵','🎶','🎸','🎹','🥁'];

let ws=null,myName='',myAvatar='',currentRoom='',isCreating=false;
let reconnectDelay=1000,maxReconnectDelay=30000,reconnectTimer=null;
let pendingReply=null,typingTimeout=null,typingState=false;
let allMessages=[],selectedMsg=null,seenMsgIds=new Set(),myMessages=new Set();
let pendingPhoto=null,onlineUsers=[];
const seenTyping=new Set();

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function showScreen(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active')}
function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

// Audio
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playSound(type){
  try{audioCtx.resume()}catch(e){}
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);g.gain.value=0.06;
  if(type==='join'){o.frequency.value=520;o.type='sine';g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);o.start();o.stop(audioCtx.currentTime+0.12)}
  else if(type==='msg'){o.frequency.value=660;o.type='sine';g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.08);o.start();o.stop(audioCtx.currentTime+0.08);setTimeout(()=>{const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.connect(g2);g2.connect(audioCtx.destination);o2.frequency.value=880;o2.type='sine';g2.gain.value=0.06;g2.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);o2.start();o2.stop(audioCtx.currentTime+0.1)},70)}
  else if(type==='err'){o.frequency.value=200;o.type='square';g.gain.value=0.04;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);o.start();o.stop(audioCtx.currentTime+0.2)}
}

// ========= PASSWORD SCREEN =========
let pwCode='';
function initPassword(){
  const dots=$('#pwDots');
  dots.innerHTML=[0,1,2,3].map(()=>'<div class="pw-dot"></div>').join('');
  const keys=[1,2,3,4,5,6,7,8,9,'',0,'DEL'];
  $('#pwGrid').innerHTML=keys.map(k=>k===''?'<button class="pw-key empty"></button>':
    `<button class="pw-key${k==='DEL'?' del':''}" data-key="${k}">${k==='DEL'?'<i class="fas fa-delete-left"></i>':k}</button>`).join('');
  $('#pwGrid').addEventListener('click',e=>{
    const btn=e.target.closest('.pw-key');
    if(!btn||btn.classList.contains('empty'))return;
    const key=btn.dataset.key;
    if(key==='DEL'){pwCode=pwCode.slice(0,-1)}
    else{if(pwCode.length<4)pwCode+=key}
    updateDots();
    if(pwCode.length===4)checkPassword();
  });
}
function updateDots(){
  $$('#pwDots .pw-dot').forEach((d,i)=>d.classList.toggle('filled',i<pwCode.length));
}
function checkPassword(){
  if(pwCode===APP_PASSWORD){pwCode='';showScreen('setup')}
  else{$('#pwErr').textContent='Wrong password!';playSound('err');pwCode='';updateDots();
    setTimeout(()=>$('#pwErr').textContent='',1500)}
}
initPassword();

// ========= SETUP =========
$('#avatarGrid').innerHTML=AVATARS.map(a=>`<div class="avatar-option" data-emoji="${a}">${a}</div>`).join('');
$$('.avatar-option').forEach(el=>el.addEventListener('click',()=>{
  $$('.avatar-option').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');myAvatar=el.dataset.emoji;checkSetup();
}));
$('#usernameInput').addEventListener('input',checkSetup);
function checkSetup(){$('#setupBtn').disabled=!(myAvatar&&$('#usernameInput').value.trim())}
$('#setupBtn').addEventListener('click',()=>{myName=$('#usernameInput').value.trim();showScreen('room')});

// ========= EMOJI PICKER =========
$('#emojiGrid').innerHTML=EMOJIS.map(e=>`<button class="emoji-item">${e}</button>`).join('');
$('#emojiBtn').addEventListener('click',()=>{
  const p=$('#emojiPicker');p.classList.toggle('open');$('#emojiBtn').classList.toggle('active');
  if(p.classList.contains('open'))$('#photoPreview').classList.remove('active');
});
$('#emojiGrid').addEventListener('click',e=>{
  if(e.target.classList.contains('emoji-item')){
    const inp=$('#msgInput');
    inp.value+=e.target.textContent;inp.focus();
  }
});

// ========= PHOTO =========
$('#photoBtn').addEventListener('click',()=>$('#photoInput').click());
$('#photoInput').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{pendingPhoto=reader.result;$('#photoPreviewImg').src=reader.result;$('#photoPreview').classList.add('active');$('#emojiPicker').classList.remove('open');$('#emojiBtn').classList.remove('active')};
  reader.readAsDataURL(file);e.target.value='';
});
$('#photoClose').addEventListener('click',()=>{pendingPhoto=null;$('#photoPreview').classList.remove('active')});

// ========= ROOM =========
$('#createRoomBtn').addEventListener('click',()=>{
  const code=Math.random().toString(36).substring(2,8).toUpperCase();
  $('#roomCodeInput').value=code;joinRoom(code,true);
});
$('#joinRoomBtn').addEventListener('click',()=>{
  const code=$('#roomCodeInput').value.trim().toUpperCase();
  if(code)joinRoom(code,false);else showToast('Enter a room code');
});
$('#roomCodeInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#joinRoomBtn').click()});

function joinRoom(code,creating){
  currentRoom=code;isCreating=!!creating;connectWS();
  $('#roomName').textContent='Room: '+code;
  $('#headerAvatar').textContent=myAvatar;
  showScreen('chat');$('#msgInput').focus();
}

// ========= WEBSOCKET =========
function connectWS(){
  if(ws){try{ws.close()}catch(e){}ws=null}
  try{
    ws=new WebSocket('wss://'+SERVER_HOST);
    ws.onopen=()=>{
      reconnectDelay=1000;clearTimeout(reconnectTimer);
      if(isCreating)ws.send(JSON.stringify({type:'generate_code',code:currentRoom}));
      ws.send(JSON.stringify({type:'join',room:currentRoom,username:myName,avatar:myAvatar}));
    };
    ws.onmessage=e=>handleMessage(JSON.parse(e.data));
    ws.onclose=()=>{
      setConnStatus(false);
      reconnectTimer=setTimeout(()=>{reconnectDelay=Math.min(reconnectDelay*2,maxReconnectDelay);connectWS()},reconnectDelay);
    };
    ws.onerror=()=>{};
  }catch(e){}
}

function setConnStatus(online){
  const dot=$('#connDot'),txt=$('#statusText');
  dot.className='conn-dot '+(online?'online':'offline');
  txt.textContent=online?'Online':'Reconnecting...';
}

function handleMessage(data){
  switch(data.type){
    case'join_success':setConnStatus(true);addSystem('You joined '+data.room);playSound('join');break;
    case'error':showToast(data.message);playSound('err');break;
    case'message':onNewMessage(data.message);break;
    case'edit_update':onEditUpdate(data);break;
    case'delete_update':onDeleteUpdate(data);break;
    case'system':addSystem(data.text);playSound('join');break;
    case'typing':onTyping(data);break;
    case'online_count':updateOnline(data);break;
    case'cleanup':cleanupOldMessages();break;
    case'pong':break;
    case'left_room':showScreen('room');showToast('Left room');break;
  }
}

function onNewMessage(msg){
  if(seenMsgIds.has(msg.id))return;
  seenMsgIds.add(msg.id);
  if(msg.sender===myName)myMessages.add(msg.id);
  allMessages.push(msg);
  renderMessage(msg);
  scrollBottom();
  if(msg.sender!==myName)playSound('msg');
  clearTyping(msg.sender);
}

function onEditUpdate(data){
  const el=document.getElementById('msg-'+data.id);
  if(el){const t=el.querySelector('.msg-text');if(t)t.textContent=data.newText;
    let ed=el.querySelector('.msg-edited');if(!ed){ed=document.createElement('span');ed.className='msg-edited';el.querySelector('.msg-meta').insertBefore(ed,el.querySelector('.msg-meta').firstChild)}
    ed.textContent='edited';
  }
  const m=allMessages.find(x=>x.id===data.id);if(m){m.text=data.newText;m.edited=true}
}

function onDeleteUpdate(data){
  const el=document.getElementById('msg-'+data.id);
  if(el){
    if(myMessages.has(data.id)){el.querySelector('.bubble').innerHTML='<span class="msg-text" style="color:var(--secondary);font-style:italic">This message was deleted</span>'}
    else{el.classList.add('deleted-msg','system-msg');el.querySelector('.bubble').innerHTML='<span class="msg-text">This message was deleted</span>';
      const av=el.querySelector('.msg-avatar');if(av)av.remove();const sn=el.querySelector('.sender');if(sn)sn.remove();
    }
  }
  myMessages.delete(data.id);
}

function onTyping(data){
  if(data.sender===myName)return;
  const ind=$('#typingIndicator'),txt=$('#typingText');
  if(data.isTyping){txt.textContent=data.sender+' is typing...';ind.style.display='flex';seenTyping.add(data.sender);
    setTimeout(()=>{seenTyping.delete(data.sender);if(seenTyping.size===0)ind.style.display='none'},3000);
  }else{seenTyping.delete(data.sender);if(seenTyping.size===0)ind.style.display='none'}
}

function updateOnline(data){
  onlineUsers=data.users||[];
  const h=$('#statusText');h.textContent=data.count+' online';
  const pills=$('#userPills');
  pills.innerHTML=onlineUsers.filter(u=>u.name!==myName).map(u=>
    `<span class="user-pill"><span class="pill-avatar">${u.avatar||'👤'}</span><span class="pill-dot"></span>${esc(u.name)}</span>`
  ).join('');
}

function cleanupOldMessages(){
  const now=Date.now();
  allMessages=allMessages.filter(m=>now-(m.timestamp||0)<180000);
  const list=$('#messagesList');
  [...list.children].forEach(el=>{
    if(el.classList.contains('message')&&el.id){
      const id=el.id.replace('msg-','');
      if(!allMessages.find(m=>m.id===id)){el.remove();seenMsgIds.delete(id)}
    }
  });
}

// ========= RENDER =========
function renderMessage(msg){
  const list=$('#messagesList');
  const prev=allMessages[allMessages.length-2];
  if(prev&&msg.timestamp-prev.timestamp>600000){
    const d=document.createElement('div');d.className='time-divider';d.innerHTML=`<span>${msg.fullTime||formatTime(msg.timestamp)}</span>`;list.appendChild(d);
  }
  const div=document.createElement('div');
  div.id='msg-'+msg.id;
  const isMine=msg.sender===myName;
  div.className='message '+(isMine?'sent':'received');

  let replyHtml='';
  if(msg.replyTo){
    const rm=allMessages.find(m=>m.id===msg.replyTo);
    if(rm)replyHtml=`<div class="reply-ref" data-id="${msg.replyTo}"><span class="reply-sender">${esc(rm.sender)}</span><span class="reply-text">${esc(rm.text)}</span></div>`;
  }

  let photoHtml='';
  if(msg.photo){photoHtml=`<img class="msg-img" src="${msg.photo}" onclick="window.open(this.src)">`}

  const tickHtml=isMine?'<span class="ticks'+(msg.edited?'':' sent-tick')+'">✓✓</span>':'';
  const editedHtml=msg.edited?'<span class="msg-edited">edited</span>':'';
  const time=msg.fullTime||formatTime(msg.timestamp);

  if(isMine){
    div.innerHTML=`<div class="bubble">${replyHtml}<span class="msg-text">${esc(msg.text)}</span>${photoHtml}<div class="msg-meta">${editedHtml}<span class="msg-time">${time}</span>${tickHtml}</div></div>`;
  }else{
    div.innerHTML=`<div class="msg-avatar">${msg.avatar||'👤'}</div><div class="bubble"><div class="sender">${esc(msg.sender)}</div>${replyHtml}<span class="msg-text">${esc(msg.text)}</span>${photoHtml}<div class="msg-meta">${editedHtml}<span class="msg-time">${time}</span></div></div>`;
  }

  div.addEventListener('click',e=>{
    if(e.target.closest('.reply-ref')){const ref=e.target.closest('.reply-ref');const rmEl=document.getElementById('msg-'+ref.dataset.id);if(rmEl)rmEl.scrollIntoView({behavior:'smooth',block:'center'})}
  });

  const touchStart={x:0,y:0};
  div.addEventListener('touchstart',e=>{touchStart.x=e.touches[0].clientX;touchStart.y=e.touches[0].clientY},{passive:true});
  div.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchStart.x;
    if(dx>60&&Math.abs(e.changedTouches[0].clientY-touchStart.y)<50){startReply(msg);e.preventDefault()}
  });

  div.addEventListener('contextmenu',e=>{e.preventDefault();showActionMenu(msg)});
  div.addEventListener('dblclick',e=>{e.preventDefault();showActionMenu(msg)});

  list.appendChild(div);
}

function showActionMenu(msg){
  const isMine=msg.sender===myName;
  const menu=$('#actionMenu');menu.innerHTML='';
  const items=[];
  if(isMine){items.push({icon:'fa-pen',label:'Edit',action:()=>startEdit(msg)});items.push({icon:'fa-trash',label:'Delete',action:()=>doDelete(msg)})}
  items.push({icon:'fa-reply',label:'Reply',action:()=>startReply(msg)});
  items.forEach(i=>{const b=document.createElement('button');b.innerHTML=`<i class="fas ${i.icon}"></i>${i.label}`;b.addEventListener('click',()=>{hideActionMenu();i.action()});menu.appendChild(b)});
  $('#actionOverlay').classList.add('active');
}
function hideActionMenu(){$('#actionOverlay').classList.remove('active')}
$('#actionOverlay').addEventListener('click',e=>{if(e.target===$('#actionOverlay'))hideActionMenu()});

function startReply(msg){
  pendingReply=msg;$('#rpName').textContent=msg.sender;$('#rpText').textContent=msg.text;
  $('#replyBar').classList.add('active');$('#msgInput').focus();
}
$('#replyClose').addEventListener('click',()=>{pendingReply=null;$('#replyBar').classList.remove('active')});

function startEdit(msg){const inp=$('#msgInput');inp.value=msg.text;inp.focus();selectedMsg=msg;inp.dataset.editId=msg.id}
function doDelete(msg){
  if(!confirm('Delete this message?'))return;
  ws.send(JSON.stringify({type:'delete_message',id:msg.id}));myMessages.delete(msg.id);
}

// ========= SEND =========
let sending=false;
$('#sendBtn').addEventListener('click',sendMessage);
$('#msgInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
});
$('#msgInput').addEventListener('input',()=>{
  if(!ws||ws.readyState!==1)return;
  if(!typingState){typingState=true;ws.send(JSON.stringify({type:'typing',isTyping:true}))}
  clearTimeout(typingTimeout);
  typingTimeout=setTimeout(()=>{typingState=false;ws.send(JSON.stringify({type:'typing',isTyping:false}))},2000);
});

function sendMessage(){
  if(sending)return;
  const inp=$('#msgInput');const text=inp.value.trim();
  if(!ws||ws.readyState!==1)return;
  if(!text&&!pendingPhoto)return;
  sending=true;setTimeout(()=>sending=false,300);

  const editId=inp.dataset.editId;
  if(editId){
    ws.send(JSON.stringify({type:'edit_message',id:editId,newText:text}));
    const m=allMessages.find(x=>x.id===editId);if(m)m.text=text;
    inp.dataset.editId='';selectedMsg=null;
  }else{
    const id=myName+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
    const ts=Date.now();
    const replyTo=pendingReply?pendingReply.id:null;
    const photo=pendingPhoto||null;
    ws.send(JSON.stringify({type:'message',text:text||'📷 Photo',id,timestamp:ts,fullTime:formatTime(ts),replyTo,photo}));
    onNewMessage({id,sender:myName,avatar:myAvatar,text:text||'📷 Photo',timestamp:ts,fullTime:formatTime(ts),replyTo,photo,edited:false});
  }
  inp.value='';
  pendingPhoto=null;$('#photoPreview').classList.remove('active');
  if(pendingReply){pendingReply=null;$('#replyBar').classList.remove('active')}
  typingState=false;clearTimeout(typingTimeout);
  try{ws.send(JSON.stringify({type:'typing',isTyping:false}))}catch(e){}
}

// ========= SETTINGS =========
$('#settingsBtn').addEventListener('click',()=>$('#settingsOverlay').classList.add('active'));
$('#settingsOverlay').addEventListener('click',e=>{if(e.target===$('#settingsOverlay'))$('#settingsOverlay').classList.remove('active')});
$('#settingsCopyCode').addEventListener('click',()=>{navigator.clipboard?.writeText(currentRoom);showToast('Code copied!');$('#settingsOverlay').classList.remove('active')});
$('#settingsLeave').addEventListener('click',()=>{
  if(!confirm('Leave room?'))return;
  try{ws.send(JSON.stringify({type:'leave_room'}))}catch(e){}
  resetChat();$('#settingsOverlay').classList.remove('active');
});

// ========= BACK / LEAVE =========
$('#backBtn').addEventListener('click',()=>{
  if(!confirm('Leave room?'))return;
  try{ws.send(JSON.stringify({type:'leave_room'}))}catch(e){}
  resetChat();
});
function resetChat(){
  seenMsgIds.clear();allMessages=[];$('#messagesList').innerHTML='';
  $('#typingIndicator').style.display='none';seenTyping.clear();
  pendingReply=null;$('#replyBar').classList.remove('active');
  pendingPhoto=null;$('#photoPreview').classList.remove('active');
  $('#emojiPicker').classList.remove('open');$('#emojiBtn').classList.remove('active');
  showScreen('room');
}

// ========= AUTO CLEANUP (client side) =========
setInterval(()=>{
  const now=Date.now();
  allMessages.filter(m=>now-(m.timestamp||0)>=180000).forEach(m=>{
    seenMsgIds.delete(m.id);myMessages.delete(m.id);
    const el=document.getElementById('msg-'+m.id);if(el)el.remove();
  });
  allMessages=allMessages.filter(m=>now-(m.timestamp||0)<180000);
},30000);

// Ping
setInterval(()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'ping'}))},25000);

// Utils
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function formatTime(ts){const d=new Date(ts);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function scrollBottom(){const c=$('#messagesContainer');setTimeout(()=>c.scrollTop=c.scrollHeight,50)}
function addSystem(text){
  const list=$('#messagesList');const d=document.createElement('div');d.className='message system-msg';
  d.innerHTML=`<div class="bubble"><span class="msg-text">${esc(text)}</span></div>`;list.appendChild(d);scrollBottom();
}
function clearTyping(name){}
</script>
